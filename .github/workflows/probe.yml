name: Test ETF-Anteilszahlen

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: yfinance installieren
        run: pip install yfinance
      - name: Anteilszahlen abfragen
        run: python probe_flows.py
