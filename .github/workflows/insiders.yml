name: Insider-Daten

on:
  schedule:
    # Mo-Fr, 23:20 UTC (nach dem Kurs-Job)
    - cron: "20 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insiders
  cancel-in-progress: false

jobs:
  insiders:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: yfinance installieren
        run: pip install yfinance
      - name: Insider-Meldungen der SEC lesen
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          INSIDER_BUDGET_MIN: "35"
        run: python fetch_insiders.py
      - name: Cluster-Käufe melden
        if: always()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify_insiders.py
      - name: Dateien einchecken
        if: always()
        run: |
          git config user.name "sektor-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add insiders.json insiders_state.json 2>/dev/null || true
          git add insider_alerts.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "Insider-Daten aktualisiert"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
