name: Beobachtungsliste

on:
  push:
    paths:
      - "watchlist.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: yfinance installieren
        run: pip install yfinance
      - name: Beobachtungsliste prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py
      - name: Dateien einchecken
        if: always()
        run: |
          git config user.name "sektor-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add watch_state.json watch_data.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "Beobachtungsliste aktualisiert"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
