name: Kurse aktualisieren

on:
  schedule:
    # Mo-Fr, 22:30 UTC (nach US-Handelsschluss, Sommer wie Winter)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: yfinance installieren
        run: pip install yfinance openpyxl
      - name: Kurse holen
        run: python fetch_data.py
      - name: Details holen (Teilbranchen und Einzelwerte)
        continue-on-error: true
        run: python fetch_details.py
      - name: Quadrantenwechsel melden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify.py
      - name: Beobachtungsliste prüfen
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py
      - name: Dateien einchecken
        if: always()
        run: |
          git config user.name "sektor-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json state.json
          git add details.json 2>/dev/null || true
          git add fund_snapshots.json 2>/dev/null || true
          git add watch_state.json watch_data.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "Kurse und Status aktualisiert"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
