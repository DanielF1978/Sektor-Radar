name: Trendlinien-Rueckblick
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Kuerzel, z. B. AAPL"
        default: "AAPL"
      years:
        description: "Jahre Historie"
        default: "10"
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: python backtest_trendlines.py
        env:
          TICKER: ${{ github.event.inputs.ticker }}
          YEARS: ${{ github.event.inputs.years }}
      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add backtest_results.json
          git commit -m "Trendlinien-Rueckblick ${{ github.event.inputs.ticker }}" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
